name: boby_ai
description: "Boby Ai Study Case."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0

  # Storage
  shared_preferences: ^2.5.4

  # DI
  get: ^4.6.1
  get_it: ^9.2.0
  injectable: ^2.3.2

  # Navigation
  auto_route: ^11.1.0

  # Networking
  dio: ^5.9.0
  retrofit: ^4.9.2

  # Utils
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  envied: ^1.3.2
  intl: ^0.20.2
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  vector_math: ^2.2.0 # For 3D transformations


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  mobx_codegen: ^2.7.5
  auto_route_generator: ^10.4.0
  flutter_lints: ^6.0.0
  envied_generator: ^1.3.2
  json_serializable: ^6.11.2
  injectable_generator: ^2.4.1
  retrofit_generator: ^10.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
flutter_intl:
  enabled: true
  arb_dir: lib/app/localization/l10n # Optional. Sets the directory of your ARB resource files. Provided value should be a valid path on your system. Default: lib/l10n
  output_dir: lib/app/localization/generated # Optional. Sets the directory of generated localization files. Provided value should be a valid path on your system. Default: lib/generated
